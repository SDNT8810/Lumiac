[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.4
  links2004/WebSockets @ ^2.6.1

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp12s]
platform = espressif8266 @ 4.2.1
board = esp12e
; ESP-12S: ESP8266, 4 MB flash. DIO is compatible with common module revisions.
board_build.flash_mode = dio
upload_speed = 115200
build_flags = -DWEBSOCKETS_SERVER_CLIENT_MAX=4
