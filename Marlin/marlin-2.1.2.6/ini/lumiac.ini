;
; Compatibility target for the former separate higher-current profile.
; Matches the normal build: 32 commanded microsteps, 3 A running current,
; 2.5 A homing current, and nominal holding current near 1.25 A.
;
[env:STM32F446ZE_btt_max_power]
extends = env:STM32F446ZE_btt
build_flags = ${env:STM32F446ZE_btt.build_flags}
              -DSPIDER_MICROSTEPS=32
              -DSPIDER_RUN_CURRENT_MA=3000
              -DSPIDER_HOME_CURRENT_MA=2500
              -DSPIDER_HOLD_MULTIPLIER=0.416666667f
