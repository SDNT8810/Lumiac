;
; Optional Lumiac bench profile, not the default build.
; Resolve reported 95-110 C driver heating and verify motor ratings before use.
; Keep homing at 2.5 A and nominal holding current near 1.25 A.
;
[env:STM32F446ZE_btt_max_power]
extends = env:STM32F446ZE_btt
build_flags = ${env:STM32F446ZE_btt.build_flags}
              -DSPIDER_MICROSTEPS=64
              -DSPIDER_RUN_CURRENT_MA=3000
              -DSPIDER_HOME_CURRENT_MA=2500
              -DSPIDER_HOLD_MULTIPLIER=0.416666667f
